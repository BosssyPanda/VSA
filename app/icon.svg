<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Month End">
  <!--
    Provisional mark. A month is a line you walk along; the short segment on the right
    is its end, which is the part of it this product is about. Degrades at 16px to a
    single bar, which is the intended floor rather than an accident.
    Accent is --color-accent / PALETTE.accent; keep the three in step.
  -->
  <rect width="32" height="32" rx="7" fill="#0f6e56"/>
  <rect x="6" y="14.5" width="14" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="22" y="14.5" width="4" height="3" rx="1.5" fill="#ffffff"/>
</svg>
